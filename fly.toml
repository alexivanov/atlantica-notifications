# fly.toml app configuration file generated for atlantica-notifications on 2026-07-28T12:47:34+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'atlantica-notifications'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATA_DIR = '/data'
  LEAD_MINUTES = '30'
  PORT = '8080'
  RESORT_TZ = 'Europe/Athens'

[[mounts]]
  source = 'atlantica_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options]
    [http_service.http_options.response]
      [http_service.http_options.response.headers]
        Referrer-Policy = 'no-referrer'
        X-Content-Type-Options = 'nosniff'

  [[http_service.checks]]
    interval = '1m0s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
